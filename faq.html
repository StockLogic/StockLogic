  <style>
    :root, [data-theme="light"] {
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'DM Sans', 'Helvetica Neue', sans-serif;

      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);

      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;

      --color-bg: #f7f6f2;
      --color-surface: #faf9f6;

      --color-surface-offset: #f0ede8;
      --color-divider: #dcd9d5;
      --color-border: #d4d1ca;

      --color-text: #1a1814;
      --color-text-muted: #6b6966;
      --color-text-faint: #b0aeaa;

      --color-primary: #1b3a6b;

    [data-theme="dark"] {
      --color-bg: #111210;
      --color-surface: #171714;
      --color-surface-2: #1d1c1a;
      --color-surface-offset: #141311;

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #111210;
        --color-surface: #171714;
        --color-surface-2: #1d1c1a;

        --color-divider: #252421;
        --color-border: #323028;

        --color-text: #e8e6e2;
        --color-text-muted: #8a8784;
        --color-text-faint: #55534f;

        --color-primary-hover: #7aa0dc;
        --color-primary-light: #1e2a3d;

        --color-accent: #d4a832;
        --color-accent-light: #2a2210;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--space-20); }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.65;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
    img, svg { display: block; max-width: 100%; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: 0.375rem; }

    .skip-link {
      position: absolute;
      top: -100%;
      left: var(--space-4);
      background: var(--color-primary);
      color: var(--color-text-inverse);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      z-index: 1000;
      transition: top var(--transition);
    }
    .skip-link:focus { top: var(--space-4); }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in oklch, var(--color-bg) 92%, transparent);
      backdrop-filter: blur(12px);

    .header-inner {

      margin-inline: auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-6);

    .logo {

      align-items: center;
      gap: var(--space-3);

    nav {

      align-items: center;
      gap: var(--space-1);
    }

    .nav-link {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-muted);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: color var(--transition), background var(--transition);
    }
    .nav-link:hover {
      color: var(--color-text);
      background: var(--color-surface-offset);

    .nav-link[aria-current="page"] {
      color: var(--color-primary);
      background: var(--color-primary-light);

    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .btn-theme {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);

      place-items: center;
      color: var(--color-text-muted);
      transition: color var(--transition), background var(--transition);
    }
    .btn-theme:hover {
      color: var(--color-text);
      background: var(--color-surface-offset);
    }

    .btn-cta {
      font-size: var(--text-sm);
      font-weight: 600;
      background: var(--color-primary);
      color: var(--color-text-inverse);
      padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-full);
      transition: background var(--transition), transform var(--transition);
    }
    .btn-cta:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    .hamburger {
      display: none;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
    }
    .hamburger:hover {
      background: var(--color-surface-offs

        <div class="faq-item reveal reveal-delay-1">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-2" id="faq-button-2">
            À qui s’adresse le site ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-2" role="region" aria-labelledby="faq-button-2" hidden>
            <p>
              Le site s’adresse à toute personne qui veut comprendre l’investissement sans jargon.
              Il est utile pour les débutants comme pour ceux qui veulent consolider leurs bases.
            </p>
          </div>
        </div>

        <div class="faq-item reveal reveal-delay-2">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-3" id="faq-button-3">
            Est-ce que vous donnez des conseils d’investissement ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-3" role="region" aria-labelledby="faq-button-3" hidden>
            <p>
              Non. Le site est éducatif uniquement. On explique les concepts, les mécanismes et les
              méthodes d’analyse, mais on ne dit pas quoi acheter ou vendre.
            </p>
          </div>
        </div>

        <div class="faq-item reveal reveal-delay-3">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-4" id="faq-button-4">
            Quels sujets sont abordés en priorité ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-4" role="region" aria-labelledby="faq-button-4" hidden>
            <p>
              Les priorités sont les bases de l’action, la lecture d’entreprise, les dividendes,
              les enveloppes comme le PEA, puis la gestion du risque et les notions utiles pour progresser.
            </p>
          </div>
        </div>

        <div class="faq-item reveal reveal-delay-1">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-5" id="faq-button-5">
            Les articles sont-ils adaptés aux débutants ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-5" role="region" aria-labelledby="faq-button-5" hidden>
            <p>
              Oui. Chaque sujet est expliqué depuis le niveau débutant jusqu’à un niveau plus avancé,
              avec des exemples concrets et des définitions simples.
            </p>
          </div>
        </div>

        <div class="faq-item reveal reveal-delay-2">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-6" id="faq-button-6">
            À quelle fréquence publiez-vous ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-6" role="region" aria-labelledby="faq-button-6" hidden>
            <p>
              Tu peux mettre une fréquence réaliste, par exemple un nouvel article chaque semaine,
              ou l’ajuster selon ton rythme de publication.
            </p>
          </div>
        </div>

        <div class="faq-item reveal reveal-delay-3">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-panel-7" id="faq-button-7">
            Comment savoir par où commencer ?
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="faq-answer" id="faq-panel-7" role="region" aria-labelledby="faq-button-7" hidden>
            <p>
              Commence par les articles qui expliquent ce qu’est une action, comment lire un bilan,
              puis enchaîne avec le PEA, les dividendes et la gestion du risque.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  .faq {
    background: var(--color-surface);
  }

  .faq-layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: var(--space-16);
    align-items: start;
  }

  .faq-intro {
    position: sticky;
    top: calc(var(--space-20) + var(--space-4));
  }

  .faq-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .faq-item {
    background: var(--color-surface-2);
    border: 1px solid oklch(from var(--color-text) l c h / 0.08);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .faq-question {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-5) var(--space-6);
    font-size: var(--text-base);
    font-weight: 600;
    text-align: left;
    color: var(--color-text);
    transition: background var(--transition), color var(--transition);
  }

  .faq-question:hover {
    background: var(--color-surface-offset);
  }

  .faq-question[aria-expanded="true"] {
    color: var(--color-primary);
    background: color-mix(in oklch, var(--color-primary-light) 45%, transparent);
  }

  .faq-icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    color: var(--color-text-muted);
    transition: transform var(--transition), color var(--transition);
  }

  .faq-question[aria-expanded="true"] .faq-icon {
    transform: rotate(45deg);
    color: var(--color-primary);
  }

  .faq-answer {
    overflow: hidden;
    max-height: 0;
    padding: 0 var(--space-6);
    transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.35s;
  }

  .faq-answer.open {
    padding-bottom: var(--space-5);
  }

  .faq-answer p {
    font-size: var(--text-sm);
    color: var(--color-text-muted);
    line-height: 1.75;
  }

  .faq-answer strong {
    color: var(--color-text);
  }

  .faq-ask {
    margin-top: var(--space-6);
    padding: var(--space-5) var(--space-6);
    background: var(--color-primary-light);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .faq-ask p {
    font-size: var(--text-sm);
    color: var(--color-primary);
    font-weight: 500;
  }

  .faq-ask a {
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  @media (max-width: 768px) {
    .faq-layout {
      grid-template-columns: 1fr;
      gap: var(--space-8);
    }

    .faq-intro {
      position: static;
    }
  }
</style>

<script>
  document.querySelectorAll('.faq-question').forEach((button) => {
    button.addEventListener('click', () => {
      const expanded = button.getAttribute('aria-expanded') === 'true';

      document.querySelectorAll('.faq-question').forEach((otherButton) => {
        otherButton.setAttribute('aria-expanded', 'false');
        const panel = document.getElementById(otherButton.getAttribute('aria-controls'));
        if (panel) {
          panel.classList.remove('open');
          panel.style.maxHeight = '0px';
          panel.setAttribute('hidden', '');
        }
      });

      if (!expanded) {
        button.setAttribute('aria-expanded', 'true');
        const panel = document.getElementById(button.getAttribute('aria-controls'));
        if (panel) {
          panel.removeAttribute('hidden');
          panel.classList.add('open');
          panel.style.maxHeight = panel.scrollHeight + 'px';
        }
      }
    });
  });

  window.addEventListener('resize', () => {
    document.querySelectorAll('.faq-question[aria-expanded="true"]').forEach((button) => {
      const panel = document.getElementById(button.getAttribute('aria-controls'));
      if (panel) {
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  });
</script>
