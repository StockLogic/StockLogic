<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLogic — La bourse expliquée simplement</title>
  <meta name="description" content="Comprendre les actions, la bourse et les marchés financiers. Pédagogique, honnête, sans jargon inutile." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

  <style>
    :root, [data-theme="light"] {
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'DM Sans', 'Helvetica Neue', sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      --color-bg: #f7f6f2;
      --color-surface: #faf9f6;
      --color-surface-2: #ffffff;
      --color-surface-offset: #f0ede8;
      --color-divider: #dcd9d5;
      --color-border: #d4d1ca;
      --color-text: #1a1814;
      --color-text-muted: #6b6966;
      --color-text-faint: #b0aeaa;
      --color-text-inverse: #f9f8f4;
      --color-primary: #1b3a6b;
      --color-primary-hover: #142d54;
      --color-primary-active: #0e203d;
      --color-primary-light: #e8edf5;
      --color-accent: #c49a2a;
      --color-accent-light: #fdf5e0;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 3px oklch(0.2 0.01 80 / 0.07);
      --shadow-md: 0 4px 16px oklch(0.2 0.01 80 / 0.09);
      --shadow-lg: 0 12px 40px oklch(0.2 0.01 80 / 0.13);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --content-narrow: 640px;
      --content-wide: 1200px;
    }

    [data-theme="dark"] {
      --color-bg: #111210;
      --color-surface: #171714;
      --color-surface-2: #1d1c1a;
      --color-surface-offset: #141311;
      --color-divider: #252421;
      --color-border: #323028;
      --color-text: #e8e6e2;
      --color-text-muted: #8a8784;
      --color-text-faint: #55534f;
      --color-text-inverse: #1a1814;
      --color-primary: #5b88d4;
      --color-primary-hover: #7aa0dc;
      --color-primary-active: #92b5e4;
      --color-primary-light: #1e2a3d;
      --color-accent: #d4a832;
      --color-accent-light: #2a2210;
      --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.25);
      --shadow-md: 0 4px 16px oklch(0 0 0 / 0.35);
      --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #111210;
        --color-surface: #171714;
        --color-surface-2: #1d1c1a;
        --color-surface-offset: #141311;
        --color-divider: #252421;
        --color-border: #323028;
        --color-text: #e8e6e2;
        --color-text-muted: #8a8784;
        --color-text-faint: #55534f;
        --color-text-inverse: #1a1814;
        --color-primary: #5b88d4;
        --color-primary-hover: #7aa0dc;
        --color-primary-active: #92b5e4;
        --color-primary-light: #1e2a3d;
        --color-accent: #d4a832;
        --color-accent-light: #2a2210;
        --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.25);
        --shadow-md: 0 4px 16px oklch(0 0 0 / 0.35);
        --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.45);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--space-20); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { font-family: var(--font-body); font-size: var(--text-base); color: var(--color-text); background: var(--color-bg); min-height: 100dvh; line-height: 1.65; overflow-x: hidden; }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    h1,h2,h3,h4 { text-wrap: balance; line-height: 1.15; }
    p, li { text-wrap: pretty; }
    ul[role="list"] { list-style: none; }
    ::selection { background: color-mix(in oklch, var(--color-primary) 20%, transparent); }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .skip-link {
      position: absolute; top: -100%; left: var(--space-4);
      background: var(--color-primary); color: var(--color-text-inverse);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
      font-size: var(--text-sm); font-weight: 600; z-index: 1000;
      transition: top var(--transition);
    }
    .skip-link:focus { top: var(--space-4); }

    header {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in oklch, var(--color-bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-divider);
      transition: background var(--transition), border-color var(--transition);
    }

    .header-inner {
      max-width: var(--content-wide);
      margin-inline: auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-6);
      position: relative;
    }

    .logo {
      display: flex; align-items: center; gap: var(--space-3);
      font-family: var(--font-display); font-size: var(--text-xl);
      color: var(--color-text); letter-spacing: -0.02em;
    }

    .logo-icon { width: 36px; height: 36px; flex-shrink: 0; }
    .logo-dot { color: var(--color-accent); }

    nav { display: flex; align-items: center; gap: var(--space-1); }
    .nav-link {
      font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-muted); padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: color var(--transition), background var(--transition);
    }
    .nav-link:hover { color: var(--color-text); background: var(--color-surface-offset); }

    .header-actions { display: flex; align-items: center; gap: var(--space-3); }
    .btn-theme {
      width: 40px; height: 40px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-muted);
      transition: color var(--transition), background var(--transition);
    }
    .btn-theme:hover { color: var(--color-text); background: var(--color-surface-offset); }

    .btn-cta {
      font-size: var(--text-sm); font-weight: 600;
      background: var(--color-primary); color: var(--color-text-inverse);
      padding: var(--space-2) var(--space-5); border-radius: var(--radius-full);
      transition: background var(--transition), transform var(--transition);
    }
    .btn-cta:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
    .btn-cta:active { transform: translateY(0); }

    .hamburger {
      display: none; width: 40px; height: 40px;
      align-items: center; justify-content: center;
      border-radius: var(--radius-md); color: var(--color-text-muted);
      transition: color var(--transition), background var(--transition);
    }
    .hamburger:hover { background: var(--color-surface-offset); color: var(--color-text); }

    @media (max-width: 768px) {
      nav, .btn-cta { display: none; }
      .hamburger { display: flex; }
      nav.open {
        display: flex; flex-direction: column; align-items: stretch;
        position: absolute; top: 100%; left: 0; right: 0;
        background: var(--color-surface-2);
        border-bottom: 1px solid var(--color-divider);
        padding: var(--space-4); gap: var(--space-1);
        animation: slideDown 0.2s ease;
      }
      @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    }

    .hero {
      padding: clamp(var(--space-16), 10vw, var(--space-24)) var(--space-6) clamp(var(--space-12), 8vw, var(--space-20));
      max-width: var(--content-wide); margin-inline: auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12);
      align-items: center;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: var(--space-2);
      background: var(--color-primary-light); color: var(--color-primary);
      font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
      margin-bottom: var(--space-5);
    }

    .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    .hero h1 {
      font-family: var(--font-display);
      font-size: var(--text-3xl); font-weight: 400;
      color: var(--color-text); letter-spacing: -0.02em;
      margin-bottom: var(--space-6);
    }

    .hero h1 em { font-style: italic; color: var(--color-primary); }

    .hero-desc {
      font-size: var(--text-lg); color: var(--color-text-muted);
      max-width: 52ch; line-height: 1.7; margin-bottom: var(--space-8);
    }

    .hero-actions { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: var(--space-2);
      background: var(--color-primary); color: var(--color-text-inverse);
      font-size: var(--text-sm); font-weight: 600;
      padding: var(--space-3) var(--space-6); border-radius: var(--radius-full);
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px oklch(from var(--color-primary) l c h / 0.3);
    }

    .btn-primary:hover { background: var(--color-primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px oklch(from var(--color-primary) l c h / 0.35); }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: var(--space-2);
      color: var(--color-text-muted); font-size: var(--text-sm); font-weight: 500;
      padding: var(--space-3) var(--space-4);
      transition: color var(--transition);
    }
    .btn-secondary:hover { color: var(--color-text); }

    .hero-visual { position: relative; display: flex; align-items: center; justify-content: center; }

    .hero-card {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-lg);
      width: 100%; max-width: 400px;
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

    .hero-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-5); }
    .hero-card-title { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
    .hero-card-value { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 400; margin-top: var(--space-1); }
    .hero-card-badge { background: #dcf5e8; color: #1a6b3a; font-size: var(--text-xs); font-weight: 600; padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); }
    [data-theme="dark"] .hero-card-badge { background: #1a3d28; color: #5dbb82; }

    .sparkline { width: 100%; height: 80px; margin-bottom: var(--space-4); }
    .sparkline path { fill: none; stroke: var(--color-primary); stroke-width: 2.5; stroke-linecap: round; }
    .sparkline path.fill { fill: color-mix(in oklch, var(--color-primary) 12%, transparent); stroke: none; }

    .hero-card-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-3); padding-top: var(--space-4);
      border-top: 1px solid var(--color-divider);
    }

    .stat-item { text-align: center; }
    .stat-label { font-size: var(--text-xs); color: var(--color-text-faint); }
    .stat-value { font-size: var(--text-sm); font-weight: 600; margin-top: 2px; }

    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; gap: var(--space-10); }
      .hero-visual { order: -1; }
      .hero-card { max-width: 100%; }
    }

    .section-container {
      max-width: var(--content-wide); margin-inline: auto;
      padding: clamp(var(--space-12), 8vw, var(--space-20)) var(--space-6);
    }

    .section-label {
      font-size: var(--text-xs); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--color-accent);
      margin-bottom: var(--space-3);
    }

    .section-title {
      font-family: var(--font-display); font-size: var(--text-2xl);
      font-weight: 400; letter-spacing: -0.02em;
      color: var(--color-text); margin-bottom: var(--space-4);
    }

    .section-title em { font-style: italic; color: var(--color-primary); }

    .section-desc {
      font-size: var(--text-base); color: var(--color-text-muted);
      max-width: 60ch; line-height: 1.7; margin-bottom: var(--space-10);
    }

    .divider { border: none; border-top: 1px solid var(--color-divider); margin: 0; }

    .topics { background: var(--color-surface); }
    .topics-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: var(--space-4);
    }

    .topic-card {
      background: var(--color-surface-2);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
      cursor: pointer; text-align: left;
    }

    .topic-card:hover {
      box-shadow: var(--shadow-md); transform: translateY(-3px);
      border-color: oklch(from var(--color-primary) l c h / 0.25);
    }

    .topic-icon {
      width: 44px; height: 44px; margin-bottom: var(--space-4);
      color: var(--color-primary);
    }

    .topic-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
    .topic-desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.6; }

    .topic-tag {
      display: inline-block; margin-top: var(--space-4);
      font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em;
      color: var(--color-primary); background: var(--color-primary-light);
      padding: 2px var(--space-2); border-radius: var(--radius-sm);
    }

    .articles-grid {
      display: grid; grid-template-columns: 2fr 1fr;
      gap: var(--space-6); align-items: start;
    }

    .article-featured {
      background: var(--color-surface-2);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      border-radius: var(--radius-xl); overflow: hidden;
      transition: box-shadow var(--transition);
    }

    .article-featured:hover { box-shadow: var(--shadow-lg); }

    .article-featured-img {
      width: 100%; aspect-ratio: 16/7;
      background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-accent-light) 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    .article-featured-img-inner {
      font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 400;
      color: var(--color-primary); opacity: 0.15; letter-spacing: -0.04em;
      user-select: none;
    }

    .article-featured-content { padding: var(--space-8); }
    .article-meta { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .article-cat { font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-accent); }
    .article-date { font-size: var(--text-xs); color: var(--color-text-faint); }
    .article-title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 400; margin-bottom: var(--space-3); }
    .article-excerpt { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.7; margin-bottom: var(--space-6); max-width: 58ch; }

    .read-more {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-size: var(--text-sm); font-weight: 600; color: var(--color-primary);
      transition: gap var(--transition), color var(--transition);
    }
    .read-more:hover { gap: var(--space-3); color: var(--color-primary-hover); }
    .read-more svg { transition: transform var(--transition); }
    .read-more:hover svg { transform: translateX(3px); }

    .articles-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .article-item {
      background: var(--color-surface-2);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      border-radius: var(--radius-lg); padding: var(--space-5);
      transition: box-shadow var(--transition), border-color var(--transition);
    }

    .article-item:hover {
      box-shadow: var(--shadow-sm);
      border-color: oklch(from var(--color-primary) l c h / 0.2);
    }

    .article-item-cat { font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-accent); margin-bottom: var(--space-2); }
    .article-item-title { font-size: var(--text-base); font-weight: 600; line-height: 1.4; margin-bottom: var(--space-2); }
    .article-item-date { font-size: var(--text-xs); color: var(--color-text-faint); }

    @media (max-width: 768px) { .articles-grid { grid-template-columns: 1fr; } }

    .faq { background: var(--color-surface); }
    .faq-layout {
      display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-16); align-items: start;
    }

    .faq-intro { position: sticky; top: calc(var(--space-20) + var(--space-4)); }
    .faq-list { display: flex; flex-direction: column; gap: var(--space-3); }

    .faq-item {
      background: var(--color-surface-2);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .faq-question {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      gap: var(--space-4); padding: var(--space-5) var(--space-6);
      font-size: var(--text-base); font-weight: 600; text-align: left;
      color: var(--color-text);
      transition: background var(--transition), color var(--transition);
    }

    .faq-question:hover { background: var(--color-surface-offset); }
    .faq-question[aria-expanded="true"] {
      color: var(--color-primary);
      background: color-mix(in oklch, var(--color-primary-light) 45%, transparent);
    }

    .faq-icon {
      flex-shrink: 0; width: 20px; height: 20px; color: var(--color-text-muted);
      transition: transform var(--transition), color var(--transition);
    }

    .faq-question[aria-expanded="true"] .faq-icon { transform: rotate(45deg); color: var(--color-primary); }

    .faq-answer {
      overflow: hidden;
      max-height: 0;
      padding: 0 var(--space-6);
      transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.35s;
    }

    .faq-answer.open { padding-bottom: var(--space-5); }
    .faq-answer p { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.75; }
    .faq-answer strong { color: var(--color-text); }

    .faq-ask {
      margin-top: var(--space-6); padding: var(--space-5) var(--space-6);
      background: var(--color-primary-light); border-radius: var(--radius-lg);
      display: flex; align-items: center; gap: var(--space-3);
    }

    .faq-ask p { font-size: var(--text-sm); color: var(--color-primary); font-weight: 500; }
    .faq-ask a { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 768px) {
      .faq-layout { grid-template-columns: 1fr; gap: var(--space-8); }
      .faq-intro { position: static; }
    }

    .newsletter {
      background: var(--color-primary);
      padding: clamp(var(--space-12), 8vw, var(--space-20)) var(--space-6);
    }

    .newsletter-inner {
      max-width: var(--content-narrow); margin-inline: auto; text-align: center;
    }

    .newsletter h2 {
      font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 400;
      color: var(--color-text-inverse); margin-bottom: var(--space-4); letter-spacing: -0.02em;
    }

    .newsletter p { font-size: var(--text-base); color: oklch(from var(--color-text-inverse) l c h / 0.75); margin-bottom: var(--space-8); }

    .newsletter-form { display: flex; gap: var(--space-3); max-width: 440px; margin-inline: auto; }

    .newsletter-input {
      flex: 1; padding: var(--space-3) var(--space-4);
      border: 1px solid oklch(from var(--color-text-inverse) l c h / 0.25);
      border-radius: var(--radius-full); background: oklch(from var(--color-text-inverse) l c h / 0.1);
      color: var(--color-text-inverse); font-size: var(--text-sm); font-family: var(--font-body);
      transition: border-color var(--transition), background var(--transition);
    }

    .newsletter-input::placeholder { color: oklch(from var(--color-text-inverse) l c h / 0.5); }
    .newsletter-input:focus { outline: none; border-color: var(--color-text-inverse); background: oklch(from var(--color-text-inverse) l c h / 0.15); }

    .newsletter-btn {
      padding: var(--space-3) var(--space-6); border-radius: var(--radius-full);
      background: var(--color-text-inverse); color: var(--color-primary);
      font-size: var(--text-sm); font-weight: 700;
      transition: background var(--transition), transform var(--transition);
      white-space: nowrap;
    }

    .newsletter-btn:hover { background: var(--color-accent-light); transform: translateY(-1px); }
    .newsletter-disclaimer { font-size: var(--text-xs); color: oklch(from var(--color-text-inverse) l c h / 0.5); margin-top: var(--space-4); }

    @media (max-width: 480px) { .newsletter-form { flex-direction: column; } .newsletter-btn { width: 100%; } }

    footer {
      background: var(--color-text); color: var(--color-text-inverse);
      padding: clamp(var(--space-10), 6vw, var(--space-16)) var(--space-6) var(--space-8);
    }

    .footer-inner { max-width: var(--content-wide); margin-inline: auto; }

    .footer-top {
      display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: var(--space-16);
      padding-bottom: var(--space-10); border-bottom: 1px solid oklch(from var(--color-text-inverse) l c h / 0.12);
      margin-bottom: var(--space-8);
      flex-wrap: wrap;
    }

    .footer-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .footer-links { display: flex; flex-direction: column; gap: var(--space-3); align-items: center; }
    .footer-bottom { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-4); }

    .footer-brand .logo { color: var(--color-text-inverse); margin-bottom: var(--space-4); }
    .footer-tagline { font-size: var(--text-sm); color: oklch(from var(--color-text-inverse) l c h / 0.55); line-height: 1.6; max-width: 36ch; }
    .footer-col-title { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(from var(--color-text-inverse) l c h / 0.4); margin-bottom: var(--space-4); }
    .footer-links a { font-size: var(--text-sm); color: oklch(from var(--color-text-inverse) l c h / 0.65); transition: color var(--transition); }
    .footer-links a:hover { color: var(--color-text-inverse); }
    .footer-legal { font-size: var(--text-xs); color: oklch(from var(--color-text-inverse) l c h / 0.4); line-height: 1.6; max-width: 70ch; }
    .footer-copy { font-size: var(--text-xs); color: oklch(from var(--color-text-inverse) l c h / 0.35); white-space: nowrap; }

    @media (max-width: 480px) { .footer-top { gap: var(--space-8); } }

    .reveal {
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Aller au contenu</a>

<header>
  <div class="header-inner">
    <a href="./" class="logo" aria-label="StockLogic — Accueil">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="var(--color-primary)"/>
        <polyline points="6,26 13,18 19,22 28,10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="10" r="2.5" fill="var(--color-accent)"/>
      </svg>
      Stock<span class="logo-dot">Logic</span>
    </a>

    <nav id="main-nav" role="navigation" aria-label="Navigation principale">
      <a href="./#topics" class="nav-link">Thèmes</a>
      <a href="./#articles" class="nav-link">Articles</a>
      <a href="./faq.html" class="nav-link">FAQ</a>
      <a href="./#newsletter" class="nav-link">Newsletter</a>
      <a href="./about.html" class="nav-link">À propos</a>
      <a href="./contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="btn-theme" data-theme-toggle aria-label="Basculer le thème">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="./#newsletter" class="btn-cta">S'abonner</a>
      <button class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <!-- colle ici le contenu de tes sections existantes -->
</main>

<section class="newsletter" id="newsletter">
  <div class="newsletter-inner">
    <h2>Recevoir les prochains articles</h2>
    <p>Une fois par semaine, sans spam.</p>

    <form class="newsletter-form" onsubmit="handleSubscribe(event)">
      <input class="newsletter-input" type="email" placeholder="Ton email" required />
      <button class="newsletter-btn" type="submit">S'abonner</button>
    </form>

    <div class="newsletter-disclaimer">En t'abonnant, tu acceptes de recevoir nos emails.</div>
  </div>
</section>

<script>
  (function () {
    const r = document.documentElement;
    const t = document.querySelector('[data-theme-toggle]');
    let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', d);

    function updateIcon() {
      if (!t) return;
      t.innerHTML = d === 'dark'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      t.setAttribute('aria-label', 'Basculer vers le mode ' + (d === 'dark' ? 'clair' : 'sombre'));
    }

    updateIcon();

    if (t) {
      t.addEventListener('click', () => {
        d = d === 'dark' ? 'light' : 'dark';
        r.setAttribute('data-theme', d);
        updateIcon();
      });
    }
  })();

  const ham = document.querySelector('.hamburger');
  const nav = document.getElementById('main-nav');

  if (ham && nav) {
    ham.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      ham.setAttribute('aria-expanded', open);
    });
  }

  document.querySelectorAll('.faq-question').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.nextElementSibling;
      const expanded = btn.getAttribute('aria-expanded') === 'true';

      document.querySelectorAll('.faq-question').forEach(b => {
        b.setAttribute('aria-expanded', 'false');
        const p = b.nextElementSibling;
        if (p) {
          p.classList.remove('open');
          p.hidden = true;
          p.style.maxHeight = '0px';
        }
      });

      if (!expanded && panel) {
        btn.setAttribute('aria-expanded', 'true');
        panel.hidden = false;
        panel.classList.add('open');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  });

  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  reveals.forEach(el => observer.observe(el));

  function handleSubscribe(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    const input = form.querySelector('input');
    if (!btn || !input) return;

    btn.textContent = '✓ Inscrit !';
    btn.style.background = '#5dbb82';
    btn.style.color = '#0f2d18';
    input.value = '';

    setTimeout(() => {
      btn.textContent = "S'abonner";
      btn.style.background = '';
      btn.style.color = '';
    }, 3000);
  }
</script>
</body>
</html>
